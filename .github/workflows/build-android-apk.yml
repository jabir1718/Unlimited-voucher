name: Android APK and Browser Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlimited-voucher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases for browser download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(grep -oE "versionName '[^']+'" app/build.gradle | cut -d "'" -f 2)"
          VERSION_CODE="$(grep -oE 'versionCode [0-9]+' app/build.gradle | awk '{print $2}')"
          TAG="v${VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ] || [ ! -s "$APK" ]; then
            echo "Version metadata or APK missing; refusing to publish."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Unlimited Voucher ${VERSION}" \
              --notes "Version ${VERSION} (versionCode ${VERSION_CODE}). Download app-debug.apk on your Android phone. For this initial debug build, uninstall the previous version before installing this APK."
          fi
